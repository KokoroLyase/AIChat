# 每次推送：代码检查（lint）、单元测试、构建 debug 包
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint、单元测试、debug 包
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

      - name: 上传 debug 包
        uses: actions/upload-artifact@v7
        with:
          name: AIChat-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
