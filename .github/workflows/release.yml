# 推送 v 开头的 tag：构建签名的 release 包，计算 SHA-256，上传到对应 Release。
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   AICHAT_KEYSTORE_BASE64   正式 keystore 文件的 Base64（base64 -w0 aichat-release.jks）
#   AICHAT_KEYSTORE_PASSWORD keystore 密码
#   AICHAT_KEY_ALIAS         密钥别名
#   AICHAT_KEY_PASSWORD      密钥密码
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: 核对 tag 与 versionName 一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "tag=$TAG_VERSION app=$APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 里的 versionName $APP_VERSION 不一致"
            exit 1
          fi
          echo "VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.AICHAT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 AICHAT_KEYSTORE_BASE64，不能发布未签名或 debug 签名的包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aichat-release.jks"

      - name: 单元测试与签名 release 包
        env:
          AICHAT_KEYSTORE_FILE: ${{ runner.temp }}/aichat-release.jks
          AICHAT_KEYSTORE_PASSWORD: ${{ secrets.AICHAT_KEYSTORE_PASSWORD }}
          AICHAT_KEY_ALIAS: ${{ secrets.AICHAT_KEY_ALIAS }}
          AICHAT_KEY_PASSWORD: ${{ secrets.AICHAT_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PrequireReleaseSigning=true --stacktrace

      - name: 归档 R8 mapping（仅 CI 产物，不放入 Release）
        uses: actions/upload-artifact@v6
        with:
          name: mapping-${{ env.VERSION }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: 校验签名、改名并计算 SHA-256
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "AIChat-$VERSION.apk"
          sha256sum "AIChat-$VERSION.apk" > "AIChat-$VERSION.apk.sha256"
          cat "AIChat-$VERSION.apk.sha256"

      - name: 发布 Release（不勾选 Pre-release，否则「最新 Release」接口取不到）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/v$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少更新说明 $NOTES（App 内更新弹窗直接显示这份说明）"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "AIChat-$VERSION.apk" "AIChat-$VERSION.apk.sha256" \
            --title "智信 $VERSION" \
            --notes-file "$NOTES" \
            --latest

      - name: 清理密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/aichat-release.jks"
